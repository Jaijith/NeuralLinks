name: Deploy Backend

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'

env:
  AWS_REGION: us-west-2
  PYTHON_VERSION: '3.11'

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Get Lambda function name
        id: get-lambda
        run: |
          FUNCTION_NAME=$(aws lambda list-functions --query "Functions[?contains(FunctionName, 'BackendStack-BackendFunction')].FunctionName" --output text)
          echo "function_name=$FUNCTION_NAME" >> $GITHUB_OUTPUT

      - name: Create deployment package
        run: |
          cd backend
          pip install -r requirements.txt -t .
          zip -r ../lambda-deployment.zip . -x "*.pyc" "__pycache__/*" "*.git*" "venv/*" "*.env"

      - name: Update Lambda function code
        run: |
          aws lambda update-function-code \
            --function-name ${{ steps.get-lambda.outputs.function_name }} \
            --zip-file fileb://lambda-deployment.zip

      - name: Wait for update to complete
        run: |
          aws lambda wait function-updated \
            --function-name ${{ steps.get-lambda.outputs.function_name }}

      - name: Output deployment info
        run: |
          echo "Backend deployed successfully!"

